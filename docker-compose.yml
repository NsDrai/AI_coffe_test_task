# Локальный PostgreSQL для разработки: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: kvarta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kvarta
      POSTGRES_PASSWORD: kvarta
      POSTGRES_DB: kvarta
      TZ: UTC
      PGTZ: UTC
    ports:
      # Наружу отдаём 15432: локальный PostgreSQL обычно уже занял 5432
      - "15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Схема накатывается при первом запуске контейнера
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvarta -d kvarta"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg-data:
